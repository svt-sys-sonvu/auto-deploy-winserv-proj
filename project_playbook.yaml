---
- name: Standardized Dell PowerEdge R6615 deployment
  hosts: localhost
  connection: local
  gather_facts: false
  serial: "{{ batch_size | int }}"

  collections:
    - dellemc.openmanage
    - ansible.utils
    - ansible.windows
    - community.general

  vars_prompt:
    - name: new_idrac_password
      prompt: "Enter new iDRAC root password"
      private: true
      unsafe: true

    - name: confirm_password_use
      prompt: "Continue with this iDRAC password? (yes/no)"
      private: false

  pre_tasks:
    - name: Stop if not confirmed
      ansible.builtin.fail:
        msg: Deployment cancelled by user
      when: confirm_password_use | lower not in ['y', 'yes']

    - name: Load CSV inventory
      community.general.read_csv:
        path: "{{ csv_file }}"
        delimiter: ','
      register: csv_data

    - name: Validate CSV input
      ansible.builtin.include_role:
        name: validate_input
      vars:
        server_list: "{{ csv_data.list }}"

  tasks:
    - name: Process configure each server
      loop: "{{ csv_data.list }}"
      loop_control:
        loop_var: server
        label: "{{ server.service_tag }}"
      block:
        - name: Announce target server perform reconfig
          ansible.builtin.debug:
            msg: 'Processing {{ server.service_tag }} with iDRAC IP Adress {{ server.static_ip }}'

        - name: Configure iDRAC
          ansible.builtin.include_role:
            name: idrac_config
          vars:
            source_idrac_ip: "{{ server.dhcp_ip }}"
            target_server: "{{ server.service_tag }}"
            target_idrac_ip: "{{ server.static_ip }}"
            target_idrac_netmask: "{{ server.netmask }}"
            target_idrac_gw: "{{ server.gateway }}"
            target_idrac_dns: "{{ server.preferred_dns }}"
            target_idrac_ntp: "{{ server.ntp_server }}"
            target_idrac_user: "{{ server.username }}"
            default_password: "{{ server.def_password }}"
            target_idrac_password: "{{ new_idrac_password }}"
            target_dns_idrac_name: "{{ server.dns_idrac_name }}"

        - name: Configure BIOS
          ansible.builtin.include_role:
            name: bios_config
          vars:
            target_server: "{{ server.service_tag }}"
            target_idrac_ip: "{{ server.static_ip }}"
            target_idrac_user: "{{ server.username }}"
            target_idrac_password: "{{ new_idrac_password }}"

        - name: Upgrade firmware when repository is provided
          ansible.builtin.include_role:
            name: upgrade_firmware
          vars:
            target_server: "{{ server.service_tag }}"
            target_idrac_ip: "{{ server.static_ip }}"
            target_idrac_user: "{{ server.username }}"
            target_idrac_password: "{{ new_idrac_password }}"
          when: firmware_repo_uri is defined and firmware_repo_uri | length > 0

        - name: Deploy operating system when ISO is provided
          ansible.builtin.include_role:
            name: os_deployment
          vars:
            target_server: "{{ server.service_tag }}"
            target_idrac_ip: "{{ server.static_ip }}"
            target_idrac_user: "{{ server.username }}"
            target_idrac_password: "{{ new_idrac_password }}"
          when: windows_iso_url is defined and windows_iso_url | length > 0
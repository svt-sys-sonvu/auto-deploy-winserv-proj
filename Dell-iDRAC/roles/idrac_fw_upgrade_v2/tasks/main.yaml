- name: "Update the iDRAC firmware from a single executable file available in a local path"
  dellemc.openmanage.redfish_firmware:
    baseuri: "{{ server.permanent_ip }}:{{ target_idrac_port }}"
    username: "{{ server.username }}"
    password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"

    timeout: 300
    image_uri: "{{ idrac_firmware }}"
    job_wait: true
    job_wait_timeout: 3600 
  register: idrac_upgrade_result
  retries: "{{ retries_count }}"
  delay: "{{ polling_interval }}"

- name: Wait 5 minutes for rebooting iDRAC after new firmware to be applied 
  ansible.builtin.wait_for:
    host: "{{ server.permanent_ip }}"
    port: 443
    timeout: "{{ idrac_wait_timeout | default(300) }}"
  register: waiting_idrac_up

- name: "Track iDRRAC firmware update job"
  ansible.builtin.uri:
    url: "https://{{ server.permanent_ip }}{{ idrac_upgrade_result.task.uri }}"
    validate_certs: "{{ validate_certs }}"
    user: "{{ server.username }}"
    password: "{{ idrac_root_passwd }}"
    method: "GET"
    use_proxy: yes
    status_code: 200, 202
    return_content: yes
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
  register: idrac_job_result
  until: idrac_job_result.json.TaskState == 'Completed'
  retries: "{{ retries_count }}"
  delay: "{{ polling_interval }}"

- name: "Fact from iDRAC firmware upgrade"
  set_fact:
    job_details: "{{  idrac_job_result.json }}"
  failed_when: final_result.json.TaskState == "Completed" and final_result.json.TaskStatus != "OK"
  changed_when: final_result.json.TaskState == "Completed" and final_result.json.TaskStatus == "OK"

- name: "Update the BIOS firmware from a single executable file available in a local path"
  dellemc.openmanage.redfish_firmware:
    baseuri: "{{ server.permanent_ip }}:{{ target_idrac_port }}"
    username: "{{ server.username }}"
    password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"

    timeout: 300
    image_uri: "{{ bios_firmware }}"
    job_wait: true
    job_wait_timeout: 3600 
  register: bios_upgrade_result
  retries: "{{ retries_count }}"
  delay: "{{ polling_interval }}"

- name: Performs a power cycle on the device for updating BIOS
  dellemc.openmanage.redfish_powerstate:
    baseuri: "{{ server.permanent_ip }}:{{ target_idrac_port }}"
    username: "{{ server.username }}"
    password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"
    reset_type: "PowerCycle"

- name: "Track BIOS firmware update job"
  ansible.builtin.uri:
    url: "https://{{ server.permanent_ip }}{{ bios_upgrade_result.task.uri }}"
    validate_certs: "{{ validate_certs }}"
    user: "{{ server.username }}"
    password: "{{ idrac_root_passwd }}"
    method: "GET"
    use_proxy: yes
    status_code: 200, 202
    return_content: yes
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
  register: bios_job_result
  until: bios_job_result.json.TaskState == 'Completed'
  retries: "{{ retries_count }}"
  delay: "{{ polling_interval }}"
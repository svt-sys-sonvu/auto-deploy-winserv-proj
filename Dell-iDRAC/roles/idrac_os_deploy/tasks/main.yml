- name: Insert image file to Remote File Share 1 using CIFS share
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ server.permanent_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"
    force: true
    virtual_media:
      - insert: true
        index: 1
        media_type: CD
        image: "{{ cifs_operating_system_iso_url }}"
        username: "{{ cifs_username }}"
        password: "{{ cifs_password }}"
  tags: insert-media-cifs
  register: mount_iso_result

- name: Set one-time boot to virtual CD
  dellemc.openmanage.idrac_boot:
    idrac_ip: "{{ server.permanent_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"

    boot_source_override_enabled: "{{ set_system_boot }}"
    boot_source_override_mode: "{{ set_boot_mode }}"
    boot_source_override_target: "{{ set_boot_target }}"
    reset_type: "{{ system_reset_type }}"
    
    job_wait: true
    job_wait_timeout: 180
  register: boot_setup_result

- name: Wait 10 minutes for OS installation
  ansible.builtin.pause:
    minutes: 10

- name: Get current iDRAC log time
  ansible.builtin.uri:
    url: "https://{{ server.permanent_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/LogServices/Lclog"
    user: "{{ server.username }}"
    password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"
    method: GET
    return_content: yes
    force_basic_auth: yes
  register: lcinlog_time

- name: Wait for OS reboot (SYS1003 event in iDRAC log)
  ansible.builtin.uri:
    url: "https://{{ server.permanent_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/LogServices/Lclog/Entries?$filter=MessageId%20eq%20'SYS1003'"
    user: "{{ server.username }}"
    password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"
    method: GET
    return_content: yes
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
  register: reboot_log
  until: >-
    reboot_log.json.Members | selectattr('Created', 'gt', lcinlog_time.json.DateTime) | list | length > 0
  retries: 30
  delay: 10

- name: Confirm server rebooted
  ansible.builtin.debug:
    msg: "Server {{ server.permanent_ip }} has rebooted. SYS1003 event detected."

- name: Eject virtual media after OS installation
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ server.permanent_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ idrac_root_passwd }}"
    validate_certs: "{{ validate_certs }}"
    force: true
    virtual_media:
      - index: 1
        insert: false
  tags: eject-media


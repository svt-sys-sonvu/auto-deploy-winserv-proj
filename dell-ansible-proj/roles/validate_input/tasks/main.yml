---
- name: Ensure server list is not empty
  ansible.builtin.assert:
    that:
      - server_list is defined
      - server_list | length > 0
    fail_msg: "CSV input is empty or could not be read."

- name: Validate required fields in CSV rows
  ansible.builtin.assert:
    that:
      - item.service_tag is defined and item.service_tag | string | trim | length > 0
      - item.temporary_ip is defined and item.temporary_ip | string | trim | length > 0
      - item.permanent_ip is defined and item.permanent_ip | string | trim | length > 0     
      - item.username is defined and item.username | string | trim | length > 0
      - item.def_passwd is defined and item.temporary_ip | string | trim | length > 0 
      - item.netmask is defined and item.temporary_ip | string | trim | length > 0
      - item.gateway is defined and item.temporary_ip | string | trim | length > 0
      - item.preferred_dns is defined and item.temporary_ip | string | trim | length > 0
      - item.dns_idrac_name is defined and item.temporary_ip | string | trim | length > 0
    fail_msg: "Missing or empty required fields for row: {{ item }}"
  loop: "{{ server_list }}"
  loop_control:
    label: "{{ item.service_tag | default('UNKNOWN_TAG') }}"

- name: Build Permanent IP list
  ansible.builtin.set_fact:
    _permanent_ip_list: "{{ server_list | map(attribute='permanent_ip') | list }}"

- name: Ensure permanent IPs are unique
  ansible.builtin.assert:
    that:
      - _permanent_ip_list | unique | length == _permanent_ip_list | length
    fail_msg: "Duplicate static IP detected in CSV file. Please check your data."
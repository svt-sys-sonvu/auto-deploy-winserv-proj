- name: Create Volume RAID 1 for OS and RAID 5 for DATA Disk
  dellemc.openmanage.idrac_storage_volume:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ new_idrac_password }}"
    validate_certs: "{{ validate_certs }}"

    job_wait: true
    time_to_wait: 900
    job_wait_timeout: 900

    raid_reset_config: "True"
    state: "create"
    controller_id: "{{ raid_controllers[0] }}"
    volume_type: "{{ os_vol_raid_type }}"
    span_depth: 1
    span_length: "{{ raid_expected_os_disk_count }} "
    disk_cache_policy: "{{ disk_cache_policy }}"
    write_cache_policy: "{{ write_cache_policy }}"
    read_cache_policy: "{{ read_cache_policy }}"
    stripe_size: "{{ os_stripe_size }}"
    raid_init_operation: "{{ raid_init_operation }}"
    volumes:
      - name: "{{ os_volume_name }}"
        drives:
          location: {{ os_disk_location }}
      - name: "{{ data_volume_name }}"
        volume_type: "{{ data_vol_raid_type }}"
        drives:
          location: "{{ data_disk_location }}"
        span_length: "{{ raid_expected_data_disk_count }}"
        span_depth: 1
        disk_cache_policy: "{{ disk_cache_policy }}"
        write_cache_policy: "{{ write_cache_policy }}"
        read_cache_policy: "{{ read_cache_policy }}"
        stripe_size: {{ data_stripe_size }}
        raid_init_operation: "{{ raid_init_operation }}"


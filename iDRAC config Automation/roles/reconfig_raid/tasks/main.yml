---
- name: Gathering current storage controller config
  dellemc.openmanage.idrac_storage_volume:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    state: "view"
  register: storage_info
  no_log: true

- name: Extract controllers with "RAID" in their names using regex
  set_fact:
    raid_controllers: "{{ storage_info.storage_status.Message.Controller | dict2items | selectattr('key', 'search', 'RAID') | map(attribute='key') | list }}"

- name: Assert RAID controller exists
  ansible.builtin.assert:
    that:
      - raid_controllers is defined
      - raid_controllers | length > 0
    fail_msg: "CRITICAL: No RAID controller found on server {{ server.service_tag }}."

- name: Show the Storage Controller will use 
  ansible.builtin.debug:
    msg: "Selected RAID Controller: {{ raid_controllers[0] }}"

- name: Detect and extract the virtual disks associated with each RAID controller
  set_fact:
    virtual_disks: "{{ virtual_disks | default({}) | combine({ item: storage_info.storage_status.Message.Controller[item].VirtualDisk | default({}) | dict2items | map(attribute='key') | list }) }}"
  loop: "{{ raid_controllers }}"
  loop_control:
    label: "{{ item }}"

- name: Flatten the virtual disks into a list for removal
  set_fact:
    flat_virtual_disks: "{{ virtual_disks | dict2items | map(attribute='value') | sum(start=[]) }}"

- name: Show Virtual Disk Name that might be removed
  debug: 
    var: flat_virtual_disks

- name: Reset controller configuration to free up disks
  dellemc.openmanage.idrac_redfish_storage_controller:
    baseuri: "{{ server.static_ip }}:{{ target_idrac_port }}"
    username: "{{ server.username }}"
    password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    command: "ResetConfig"
    controller_id: "{{ raid_controllers[0] }}"
    job_wait: true
  when: flat_virtual_disks | length > 0
  tags:
    - reset_config

- name: Get drive inventory
  community.general.redfish_info:
    category: Systems
    command: GetDiskInventory
    baseuri: "{{ server.static_ip }}"
    username: "{{ server.username }}"
    password: "{{ server.temp_passwd }}"
  register: disk_results

- name: Extract IDs of the first 2 SSD drives strictly sorted by slot
  set_fact:
    first_two_ssd_ids: "{{ (disk_results.redfish_facts.disk.entries[0][1] | map(attribute='Drives') | flatten | selectattr('MediaType', 'equalto', 'SSD') | sort(attribute='Id') | map(attribute='Id') | list)[:2] }}"

- name: Assert that at least 2 SSDs are present for RAID 1
  ansible.builtin.assert:
    that:
      - first_two_ssd_ids | length == 2
    fail_msg: "CRITICAL: Not enough SSDs found to form a RAID 1. Found only {{ first_two_ssd_ids | length }} SSD(s)."

- name: Perform active shutdown device for importing storage config job
  dellemc.openmanage.redfish_powerstate:
    baseuri: "{{ server.static_ip }}:{{ target_idrac_port }}"
    username: "{{ server.username }}"
    password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    reset_type: "ForceOff"

- name: Pause for 3 minutes before running next step
  ansible.builtin.pause:
    minutes: 3

- name: Perform Turn on device for starting job when Lifecycle Controller is available.
  dellemc.openmanage.redfish_powerstate:
    baseuri: "{{ server.static_ip }}:{{ target_idrac_port }}"
    username: "{{ server.username }}"
    password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    reset_type: "On"

- name: Create a RAID 1 on PERC controller with exactly 2 SSD Drives
  dellemc.openmanage.redfish_storage_volume:
    baseuri: "{{ server.static_ip }}"
    username: "{{ server.username }}"
    password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"

    state: "present"
    controller_id: "{{ raid_controllers[0] }}"
    raid_type: "RAID1"
    
    drives:
      - "{{ first_two_ssd_ids[0] }}"
      - "{{ first_two_ssd_ids[1] }}"
    
    apply_time: "OnReset"
    reboot_server: true
    force_reboot: true
    job_wait: true
    job_wait_timeout: 1200
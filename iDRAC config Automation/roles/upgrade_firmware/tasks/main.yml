#     validate_certs: "{{ validate_certs }}"
#     reset_type: "PowerCycle"

- name: Run firmware upgrade from repository on a CIFS Share
  dellemc.openmanage.idrac_firmware:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"

    share_name: "{{ cifs_firmware_repo_uri }}"
    share_user: "{{ cifs_username }}"
    share_password: "{{ cifs_password }}"
    #share_mnt: "/drm_files/repository"
    catalog_file_name: "{{ firmware_catalog_file_name | default('Catalog.xml') }}"
    apply_update: true
    reboot: true
    job_wait: true
    timeout: 300
  register: firmware_result
  failed_when: 
    - firmware_result.failed == true
    - "'same version installed' not in firmware_result.msg"
    - "'unsupported firmware packages' not in firmware_result.msg"

- name: Show firmware update result
  ansible.builtin.debug:
    var: firmware_result
  when: not firmware_result.failed | default(false)

- name: Fail when firmware module reports failure
  ansible.builtin.fail:
    msg: >-
      Firmware update failed on {{ server.static_ip }}. 
      Result: {{ firmware_result }}
  when:
    - firmware_result is failed
---
- name: Change iDRAC root password when default password is provided
  dellemc.openmanage.idrac_user:
    idrac_ip: "{{ server.dhcp_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_password: "{{ server.def_passwd }}"
    idrac_port: "{{ target_idrac_port }}"
    validate_certs: "{{ validate_certs }}"
    user_name: "{{ server.username }}"
    user_password: "{{ server.temp_passwd }}"
  register: idrac_password_change
  no_log: true

- name: Configure iDRAC basic network
  dellemc.openmanage.idrac_attributes:
    idrac_ip: "{{ server.dhcp_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    idrac_attributes:
      NIC.1.Enable: "Enabled"
      IPv4.1.Enable: "Enabled"
      IPv6.1.Enable: "Disabled"
      IPv4.1.DHCPEnable: "Disabled"
      IPv4.1.Address: "{{ server.static_ip }}"
      IPv4.1.Netmask: "{{ server.netmask }}"
      IPv4.1.Gateway: "{{ server.gateway }}"
      IPv4.1.DNS1: "{{ server.preferred_dns }}"
      NIC.1.VLanEnable: "Disabled"
      NIC.1.DNSRacName: "{{ server.dns_idrac_name }}"
  register: idrac_network_result
  no_log: true

- name: Wait for iDRAC HTTPS after static IP change
  ansible.builtin.wait_for:
    host: "{{ server.static_ip }}"
    port: 443
    timeout: "{{ idrac_wait_timeout | default(300) }}"
  register: idrac_is_up

- name: Configure NTP service for iDRAC
  dellemc.openmanage.idrac_attributes:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    idrac_attributes:
      NIC.1.DNSRacName: "{{ server.dns_idrac_name }}"
      NTPConfigGroup.1.NTPEnable: "{{ idrac_ntp_enable }}"
      NTPConfigGroup.1.NTP1: "{{ ntp_server_primary }}"
      NTPConfigGroup.1.NTP2: "{{ ntp_server_secondary }}"
      Time.1.Timezone: "{{ targer_tz }}"
  register: idrac_ntp_register
  when: enable_ntp_config | lower in ['y', 'yes']
  #no_log: true

- name: Configure the iDRAC attributes for SNMP alert settings.
  dellemc.openmanage.idrac_attributes:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    idrac_attributes:
      SNMP.1.AgentEnable: "Enabled"
      SNMP.1.SNMPProtocol: All
      SNMP.1.TrapFormat: "{{ snmp_trap_format }}"
      SNMP.1.AgentCommunity: "{{ snmp_community_string }}"
      SNMP.1.AlertPort: "{{ snmp_alert_port }}"
      SNMPAlert.1.State: Enabled
      SNMPAlert.1.Destination: "{{ snmp_server }}"
  register: idrac_snmp_register
  when: enable_snmp_notification | lower in ['y', 'yes']
  #no_log: true

- name: Configure the iDRAC attributes for SMTP alert settings.
  dellemc.openmanage.idrac_attributes:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    idrac_attributes:
      RemoteHosts.1.SMTPServerIPAddress: "{{ smtp_server_target }}"
      RemoteHosts.1.SMTPAuthentication: "{{ smtp_server_auth_enable }}"
      RemoteHosts.1.SMTPPort: "{{ smtp_server_port }}"
      RemoteHosts.1.SMTPUserName: "{{ smtp_username }}"
      RemoteHosts.1.SMTPPassword: "{{ smtp_password }}"
  register: idrac_smtp_register
  when: enable_email_notification | lower in ['y', 'yes']
  #no_log: true

- name: Configure the iDRAC attributes for Syslog settings
  dellemc.openmanage.idrac_attributes:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ server.temp_passwd }}"
    validate_certs: "{{ validate_certs }}"
    idrac_attributes:
      SysLog.1.SysLogEnable: Enabled
      SysLog.1.Server1: "{{ syslog_server }}"
      SysLog.1.Port: "{{ syslog_port }}"
      SysLog.1.securesyslogenable: Disabled
      # SysLog.1.secureserver1: 192.168.0.2
      # SysLog.1.secureport: 6511
      # SysLog.1.secureclientauth: Anonymous
  register: idrac_syslog_register
  when: enable_syslog_notification | lower in ['y', 'yes']
  #no_log: true
---
- name: Change iDRAC root password when default password is provided
  dellemc.openmanage.idrac_user:
    idrac_ip: "{{ server.dhcp_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_password: "{{ server.def_password }}"
    idrac_port: "{{ target_idrac_port }}"
    validate_certs: "{{ validate_certs }}"
    user_name: "{{ server.username }}"
    user_password: "{{ new_idrac_password }}"
  register: idrac_password_change

- name: Configure iDRAC network
  dellemc.openmanage.idrac_attributes:
    idrac_ip: "{{ server.dhcp_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ new_idrac_password }}"
    validate_certs: "{{ validate_certs }}"
    idrac_attributes:
      NIC.1.Enable: "Enabled"
      IPv4.1.Enable: "Enabled"
      IPv6.1.Enable: "Disabled"
      IPv4.1.DHCPEnable: "Disabled"
      IPv4.1.Address: "{{ server.static_ip }}"
      IPv4.1.Netmask: "{{ server.netmask }}"
      IPv4.1.Gateway: "{{ server.gateway }}"
      IPv4.1.DNS1: "{{ server.preferred_dns }}"
      NIC.1.VLanEnable: "Disabled"
      NIC.1.DNSRacName: "{{ server.dns_idrac_name }}"
      NTPConfigGroup.1.NTPEnable: "Enabled"
      NTPConfigGroup.1.NTP1: "{{ server.ntp_server }}"
      Time.1.Timezone: "{{ targer_tz }}"
  register: idrac_network_result

- name: Wait for iDRAC HTTPS after static IP change
  ansible.builtin.wait_for:
    host: "{{ server.static_ip }}"
    port: 443
    timeout: "{{ idrac_wait_timeout }}"


- name: Create Volume RAID 1 for OS
  dellemc.openmanage.idrac_storage_volume:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ new_idrac_password }}"
    validate_certs: "{{ validate_certs }}"

    job_wait: true
    time_to_wait: 600
    job_wait_timeout: 900

    raid_reset_config: "True"
    state: "create"
    controller_id: "{{ raid_controllers[0] }}"
    volume_type: "{{ os_raid_type }}"
    span_depth: 1
    span_length: 2
    disk_cache_policy: "Default"
    write_cache_policy: "WriteThrough"
    read_cache_policy: "NoReadAhead"
    stripe_size: 524288 # 512 * 1024 
    raid_init_operation: "Fast"
    volumes:
      - name: "{{ os_volume_name }}"
        drives:
          location: [6, 7]

- name: Create Volume RAID 5 for Data
  dellemc.openmanage.idrac_storage_volume:
    idrac_ip: "{{ server.static_ip }}"
    idrac_user: "{{ server.username }}"
    idrac_port: "{{ target_idrac_port }}"
    idrac_password: "{{ new_idrac_password }}"
    validate_certs: "{{ validate_certs }}"

    job_wait: true
    time_to_wait: 600
    job_wait_timeout: 900

    raid_reset_config: "False"
    state: "create"
    controller_id: "{{ raid_controllers[0] }}"
    span_depth: 1
    span_length: 6
    disk_cache_policy: "Default"
    write_cache_policy: "WriteThrough"
    read_cache_policy: "NoReadAhead"
    stripe_size: 524288 # 512 * 1024 
    raid_init_operation: "Fast"
    volume_type: "{{ data_raid_type }}"
    volumes:
      - name: "{{ data_volume_name }}"
        drives:
          location: [0, 1, 2, 3, 4, 5]
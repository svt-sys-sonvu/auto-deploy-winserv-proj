---
- name: Mount Windows ISO via virtual media
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ target_idrac_ip }}"
    idrac_user: "{{ target_idrac_user }}"
    idrac_password: "{{ target_idrac_password }}"
    validate_certs: "{{ validate_certs }}"
    force: true
    virtual_media:
      insert: true
      image: "{{ windows_iso_url }}"
      media_type: CD
      username: "{{ windows_iso_username }}"
      password: "{{ windows_iso_password }}"
    state: present

- name: Set one-time boot to virtual CD
  dellemc.openmanage.idrac_boot:
    idrac_ip: "{{ target_idrac_ip }}"
    idrac_user: "{{ target_idrac_user }}"
    idrac_password: "{{ target_idrac_password }}"
    validate_certs: "{{ validate_certs }}"
    boot_source_override_enabled: "{{ set_system_boot }}"
    boot_source_override_mode: "{{ set_boot_mode }}"
    boot_source_override_target: "{{ set_boot_target }}"
    reset_type: "{{ system_reset_type }}"
    job_wait: true
    job_wait_timeout: 600

- name: Wait for WinRM after OS deployment starts
  ansible.builtin.wait_for:
    host: "{{ target_server.static_ip }}"
    port: 5985
    timeout: "{{ windows_install_wait_timeout }}"

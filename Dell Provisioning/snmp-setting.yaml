- name: dell server configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  collections:
    - dellemc.openmanage
  vars_files:
    - ./vars/server-vars.yaml
  pre_tasks:
  - name: Reading CSV file for retriving Vmware information
    read_csv:
      delimiter: ','
      path: ./vars/server-info.csv
    register: server_info
  tasks:
  - name: Configure the iDRAC attributes for Timezone settings.
    idrac_attributes:
      idrac_ip: "{{ server.IDRAC_IP }}"
      idrac_user: "root"
      idrac_password: "{{ server.IDRAC_PW }}"
      validate_certs: false
      idrac_attributes:
        SNMP.1.AgentCommunity: "{{ snmp_setting }}"
        SNMP.1.AgentEnable: "Enabled"
    loop: "{{ server_info.list }}"
    loop_control:
      loop_var: server

- name: dell server configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  collections:
    - dellemc.openmanage
  vars_files:
    - ./vars/server-vars.yaml
  pre_tasks:
  - name: Reading CSV file for retriving Server information
    read_csv:
      delimiter: ','
      path: ./vars/server-info.csv
    register: server_info
  tasks:
  - name: Configure a new iDRAC user
    dellemc.openmanage.idrac_user:
      idrac_ip: "{{ server.IDRAC_IP }}"
      idrac_user: "root"
      idrac_password: "{{ server.IDRAC_PW }}"
      validate_certs: false
      state: present
      user_name: "{{ new_account }}"
      user_password: "{{ new_account_password }}"
      privilege: Administrator
      ipmi_lan_privilege: Administrator
      ipmi_serial_privilege: Administrator
      enable: true
      sol_enable: true
      protocol_enable: true
      authentication_protocol: SHA
      privacy_protocol: AES
    loop: "{{ server_info.list }}"
    loop_control:
      loop_var: server

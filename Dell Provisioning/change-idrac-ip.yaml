- name: dell server configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  collections:
    - dellemc.openmanage
  vars_files:
    - ./vars/server-vars.yaml
  pre_tasks:
  - name: Reading CSV file for retriving Vmware information
    read_csv:
      delimiter: ','
      path: ./vars/server-info.csv
    register: server_info
  tasks:
  - name: change iDRAC IP
    idrac_attributes:
      idrac_ip: "{{ server.IDRAC_IP }}"
      idrac_user: "root"
      idrac_password: "{{ server.IDRAC_PW }}"
      validate_certs: false
      idrac_attributes:
        IPv4.1.DHCPEnable: "Disabled"
        IPv4.1.DNSFromDHCP: "Disabled"
        IPv4.1.Enable: "Enabled"
        IPv4Static.1.Address: "{{ server.IDRAC_IP }}"
        IPv4Static.1.DNS1: "8.8.8.8"
        IPv4Static.1.DNS2: "10.1.38.103"
        IPv4Static.1.Gateway: "{{ server.IDRAC_GW }}"
        IPv4Static.1.Netmask: "{{ server.IDRAC_SUBNET }}"
    loop: "{{ server_info.list }}"
    loop_control:
      loop_var: server
  
    

---

- name: Ensure server list is not empty
  ansible.builtin.assert:
    that:
      - list_hpe_server is defined
      - list_hpe_server | length > 0
    fail_msg: "CSV input is empty or could not be read"

- name: Validate required fields in CSV rows
  ansible.builtin.assert:
    that:
      - item.serial_number is defined and item.serial_number | string | trim | length > 0
      - item.ilo_hostname is defined and item.ilo_hostname | string | trim | length > 0
      - item.ilo_user_default is defined and item.ilo_user_default | string | trim | length > 0
      - item.ilo_passwd_default is defined and item.ilo_passwd_default | string | trim | length > 0     
      - item.dhcp_ipv4 is defined and item.dhcp_ipv4 | string | trim | length > 0 
      - item.permanent_ipv4 is defined and item.permanent_ipv4 | string | trim | length > 0
      - item.subnet_mask is defined and item.subnet_mask | string | trim | length > 0
      - item.ipv4_gateway is defined and item.ipv4_gateway | string | trim | length > 0
    fail_msg: "Missing or empty required fields for row: {{ item }}"
  loop: "{{ list_hpe_server }}"
  loop_control:
    label: "{{ item.serial_number | default('UNKNOWN_SERIAL_NUMBER') }}"

- name: Build Permanent IP list
  ansible.builtin.set_fact:
    _permanent_ip_list: "{{ list_hpe_server | map(attribute='permanent_ipv4') | list }}"

- name: Ensure permanent IPs are unique
  ansible.builtin.assert:
    that:
      - _permanent_ip_list | unique | length == _permanent_ip_list | length
    fail_msg: "Duplicate static IP detected in CSV file. Please check your data."